#!version:1.0.0.1
# MikoPBX Autoprovision — Yealink example template.
# Placeholders {SIP_NUM}, {SIP_USER_NAME}, {SIP_PASS} are substituted per device
# from the TemplatesUsers mapping (see GetController::getConfigStatic).

account.1.enable = 1
account.1.label = MikoPBX ({SIP_NUM})
account.1.display_name = {SIP_USER_NAME}
account.1.auth_name = {SIP_NUM}
account.1.user_name = {SIP_NUM}
account.1.password = {SIP_PASS}
account.1.sip_server_host = pbx.example.local
account.1.sip_server_port = 5060
account.1.transport = 0

account.1.codec.1.enable = 1
account.1.codec.1.payload_type = PCMU
account.1.codec.1.priority = 1

features.intercom.allow = 1
features.dtmf.transfer = 1
auto_provision.dhcp_option.enable = 0

# Uncomment after uploading firmware in the Firmware tab.
# static.auto_provision.firmware.url = {FIRMWARE_URL}
